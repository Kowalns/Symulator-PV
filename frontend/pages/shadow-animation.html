<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizualizacja cienia - Symulator PV</title>
    <link rel="stylesheet" href="../css/style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <style>
        body { margin: 0; background: #0f0f1a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        /* Nawigacja krokowa */
        .steps-bar { background: rgba(26, 26, 46, 0.95); border-bottom:1px solid rgba(245, 158, 11, 0.2); padding:12px 20px; }
        .steps-bar-inner { max-width:1400px; margin:0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
        .steps-bar a, .steps-bar span.step-item { text-decoration:none; padding:4px 12px; border-radius:16px; font-size:0.82rem; }
        .step-inactive { background: rgba(15, 15, 26, 0.8); color:#94a3b8; border: 1px solid rgba(245, 158, 11, 0.1); }
        .step-active { background: linear-gradient(135deg, #f59e0b, #f97316); color: #0f0f1a; font-weight:600; }
        .step-done { background: rgba(34, 197, 94, 0.15); color:#22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }

        /* Kontrolki */
        .controls-bar { background: rgba(26, 26, 46, 0.95); border-bottom:1px solid rgba(245, 158, 11, 0.2); padding:12px 20px; }
        .controls-inner { max-width:1400px; margin:0 auto; display:flex; align-items:center; gap:15px; flex-wrap:wrap; }
        .controls-inner label { font-size:0.8rem; color:#94a3b8; margin-right:4px; }
        .controls-inner input[type="date"],
        .controls-inner select { background:#1a1a2e; color:#e2e8f0; border:1px solid rgba(245,158,11,0.2); border-radius:6px; padding:6px 10px; font-size:0.85rem; }
        .controls-inner input[type="date"]:focus,
        .controls-inner select:focus { outline:none; border-color:#f59e0b; }
        .controls-inner input[type="range"] { width:200px; accent-color:#f59e0b; }
        .btn-ctrl { background: linear-gradient(135deg, #f59e0b, #f97316); color:#0f0f1a; border:none; padding:6px 16px; border-radius:16px; cursor:pointer; font-size:0.82rem; font-weight:600; transition:all 0.3s; }
        .btn-ctrl:hover { box-shadow:0 0 15px rgba(245,158,11,0.3); transform:translateY(-1px); }
        .btn-ctrl.playing { background: linear-gradient(135deg, #ef4444, #dc2626); color:#fff; }
        .time-display { font-size:1rem; font-weight:bold; color:#f59e0b; min-width:50px; }
        .sun-display { font-size:0.8rem; color:#94a3b8; }
        .speed-group { display:flex; gap:4px; }
        .speed-btn { background:rgba(15,15,26,0.8); color:#94a3b8; border:1px solid rgba(245,158,11,0.1); padding:4px 8px; border-radius:10px; cursor:pointer; font-size:0.75rem; transition:all 0.2s; }
        .speed-btn.active { background:rgba(245,158,11,0.2); color:#f59e0b; border-color:#f59e0b; }
        .speed-btn:hover { border-color:#f59e0b; color:#f59e0b; }

        /* Glowny layout */
        .main-layout { display:flex; height:calc(100vh - 110px); }
        .panel-left { width:60%; position:relative; border-right:1px solid rgba(245,158,11,0.15); }
        .panel-right { width:40%; overflow-y:auto; padding:20px; }

        /* Canvas 3D */
        #canvas3d { width:100%; height:100%; display:block; }

        /* Kompas */
        .compass { position:absolute; top:15px; right:15px; width:60px; height:60px; background:rgba(15,15,26,0.85); border-radius:50%; border:2px solid rgba(245,158,11,0.3); display:flex; align-items:center; justify-content:center; }
        .compass-label { position:absolute; font-size:10px; font-weight:bold; }
        .compass-n { top:3px; left:50%; transform:translateX(-50%); color:#ef4444; }
        .compass-s { bottom:3px; left:50%; transform:translateX(-50%); color:#94a3b8; }
        .compass-e { right:5px; top:50%; transform:translateY(-50%); color:#94a3b8; }
        .compass-w { left:5px; top:50%; transform:translateY(-50%); color:#94a3b8; }

        /* Panel diagram (prawa strona) */
        .diagram-title { color:#f59e0b; font-size:1rem; margin-bottom:15px; border-bottom:1px solid rgba(245,158,11,0.2); padding-bottom:8px; }
        .panel-grid { display:grid; gap:6px; margin-bottom:20px; }
        .panel-cell { border-radius:6px; padding:8px 4px; text-align:center; font-size:11px; color:#fff; min-height:55px; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:all 0.3s; border:1px solid rgba(255,255,255,0.1); }
        .panel-cell .panel-num { font-weight:bold; font-size:12px; }
        .panel-cell .panel-pct { font-size:10px; opacity:0.9; margin-top:2px; }

        /* Legenda kolorow */
        .color-legend { display:flex; flex-wrap:wrap; gap:10px; margin:15px 0; padding:10px; background:rgba(15,15,26,0.6); border-radius:8px; }
        .legend-item { display:flex; align-items:center; gap:5px; font-size:0.75rem; color:#94a3b8; }
        .legend-swatch { width:14px; height:14px; border-radius:3px; border:1px solid rgba(255,255,255,0.15); }

        /* Podsumowanie mocy */
        .power-summary { background:rgba(26,26,46,0.9); border-radius:8px; padding:15px; border:1px solid rgba(245,158,11,0.15); margin-top:15px; }
        .power-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(245,158,11,0.08); font-size:0.85rem; }
        .power-row:last-child { border-bottom:none; }
        .power-label { color:#94a3b8; }
        .power-value { font-weight:bold; color:#f59e0b; }
        .power-value.loss { color:#ef4444; }

        /* Responsywnosc */
        @media (max-width: 900px) {
            .main-layout { flex-direction:column; height:auto; }
            .panel-left { width:100%; height:50vh; }
            .panel-right { width:100%; }
            .controls-inner { gap:8px; }
            .controls-inner input[type="range"] { width:120px; }
        }
    </style>
</head>
<body>
    <!-- Nawigacja krokowa -->
    <div class="steps-bar">
        <div class="steps-bar-inner">
            <a href="../index.html" style="text-decoration:none;color:#94a3b8;font-size:0.85rem;">&#8592; Strona glowna</a>
            <span style="color:rgba(245,158,11,0.3);">|</span>
            <a href="../viewer.html" class="step-done" style="text-decoration:none;">Krok 1: Widok 3D</a>
            <span style="color:#94a3b8;">&#8594;</span>
            <a href="energy-profile.html" class="step-done" style="text-decoration:none;">Krok 2: Profil zuzycia</a>
            <span style="color:#94a3b8;">&#8594;</span>
            <a href="report.html" class="step-done" style="text-decoration:none;">Krok 3: Raport</a>
            <span style="color:#94a3b8;">&#8594;</span>
            <span class="step-item step-active">Krok 4: Wizualizacja cienia</span>
        </div>
    </div>

    <!-- Kontrolki animacji -->
    <div class="controls-bar">
        <div class="controls-inner">
            <label for="anim-date">Data:</label>
            <input type="date" id="anim-date" value="2025-06-15">

            <button class="btn-ctrl" id="btn-play" onclick="togglePlay()">&#9654; Play</button>

            <label for="anim-slider">Czas:</label>
            <input type="range" id="anim-slider" min="0" max="64" value="28" oninput="onSliderChange(this.value)">

            <span class="time-display" id="time-display">12:00</span>
            <span class="sun-display" id="sun-display">Azymut: ---, Elewacja: ---</span>

            <div class="speed-group">
                <button class="speed-btn active" data-speed="1" onclick="setSpeed(1, this)">1x</button>
                <button class="speed-btn" data-speed="2" onclick="setSpeed(2, this)">2x</button>
                <button class="speed-btn" data-speed="5" onclick="setSpeed(5, this)">5x</button>
                <button class="speed-btn" data-speed="10" onclick="setSpeed(10, this)">10x</button>
            </div>
        </div>
    </div>

    <!-- Glowny layout -->
    <div class="main-layout">
        <!-- Lewa strona - widok 3D -->
        <div class="panel-left">
            <canvas id="canvas3d"></canvas>
            <div class="compass">
                <span class="compass-label compass-n">N</span>
                <span class="compass-label compass-s">S</span>
                <span class="compass-label compass-e">E</span>
                <span class="compass-label compass-w">W</span>
            </div>
        </div>

        <!-- Prawa strona - diagram paneli -->
        <div class="panel-right">
            <h3 class="diagram-title">Diagram paneli - wydajnosc</h3>
            <div class="panel-grid" id="panel-grid"></div>
            <div class="color-legend">
                <div class="legend-item"><div class="legend-swatch" style="background:#1e3a5f;"></div>100%</div>
                <div class="legend-item"><div class="legend-swatch" style="background:#38bdf8;"></div>80-99%</div>
                <div class="legend-item"><div class="legend-swatch" style="background:#fbbf24;"></div>50-80%</div>
                <div class="legend-item"><div class="legend-swatch" style="background:#f97316;"></div>20-50%</div>
                <div class="legend-item"><div class="legend-swatch" style="background:#ef4444;"></div>0-20%</div>
            </div>
            <div class="power-summary" id="power-summary">
                <div class="power-row">
                    <span class="power-label">Moc aktualna:</span>
                    <span class="power-value" id="pwr-current">--- W</span>
                </div>
                <div class="power-row">
                    <span class="power-label">Moc bez cienia:</span>
                    <span class="power-value" id="pwr-max">--- W</span>
                </div>
                <div class="power-row">
                    <span class="power-label">Strata:</span>
                    <span class="power-value loss" id="pwr-loss">--- %</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ===== KONFIGURACJA =====
    let animInterval = null;
    let isPlaying = false;
    let speedMultiplier = 1;
    let currentStep = 28; // odpowiada 12:00 (step 0 = 5:00, step 64 = 21:00)

    // Dane z localStorage
    const lokalizacja = JSON.parse(localStorage.getItem('lokalizacja') || '{"szerokosc_geo":52.23,"dlugosc_geo":21.01}');
    const budynekConfig = JSON.parse(localStorage.getItem('budynek_config') || '{"x":0,"z":-10,"szerokosc":10,"glebokosc":8,"wysokosc":8}');
    const instalacjaConfig = JSON.parse(localStorage.getItem('instalacja_config') || '{}');
    const parcelVertices = JSON.parse(localStorage.getItem('parcel_vertices') || '[]');

    const liczbaPaneli = parseInt(instalacjaConfig.liczba_paneli || '10');
    const liczbaRzedow = parseInt(instalacjaConfig.liczba_rzedow || '1');
    const paneleWRzedzie = Math.ceil(liczbaPaneli / liczbaRzedow);

    // ===== THREE.JS SETUP =====
    const canvas = document.getElementById('canvas3d');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setClearColor(0x0f0f1a);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0f0f1a, 80, 150);

    // Kamera - widok z gory (wysoki kat)
    const aspect = canvas.parentElement.clientWidth / canvas.parentElement.clientHeight;
    const camera = new THREE.PerspectiveCamera(50, aspect, 0.1, 500);
    camera.position.set(0, 50, 30);
    camera.lookAt(0, 0, 0);

    // OrbitControls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.1;
    controls.maxPolarAngle = Math.PI / 2.2;
    controls.target.set(0, 0, 0);

    // Oswietlenie ambient
    const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
    scene.add(ambientLight);

    // DirectionalLight (slonce)
    const sunLight = new THREE.DirectionalLight(0xfff4d6, 1.5);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 120;
    sunLight.shadow.camera.left = -40;
    sunLight.shadow.camera.right = 40;
    sunLight.shadow.camera.top = 40;
    sunLight.shadow.camera.bottom = -40;
    sunLight.shadow.bias = -0.001;
    scene.add(sunLight);
    scene.add(sunLight.target);

    // Wskaznik slonca (zolta kropka)
    const sunIndicator = new THREE.Mesh(
        new THREE.SphereGeometry(0.8, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xffd700 })
    );
    scene.add(sunIndicator);

    // ===== OBIEKTY SCENY =====

    // Podloga (ziemia) - duza plaska plaszczyzna
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x2d4a2d, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    // Dzialka (zielony polygon z ULDK)
    if (parcelVertices.length >= 3) {
        const shape = new THREE.Shape();
        shape.moveTo(parcelVertices[0].x, parcelVertices[0].z);
        for (let i = 1; i < parcelVertices.length; i++) {
            shape.lineTo(parcelVertices[i].x, parcelVertices[i].z);
        }
        shape.closePath();
        const parcelGeo = new THREE.ShapeGeometry(shape);
        const parcelMat = new THREE.MeshStandardMaterial({ color: 0x3a7a3a, roughness: 0.8, side: THREE.DoubleSide });
        const parcelMesh = new THREE.Mesh(parcelGeo, parcelMat);
        parcelMesh.rotation.x = -Math.PI / 2;
        parcelMesh.position.y = 0.01;
        parcelMesh.receiveShadow = true;
        scene.add(parcelMesh);
    }

    // Budynek
    const budSzer = parseFloat(budynekConfig.szerokosc || 10);
    const budGleb = parseFloat(budynekConfig.glebokosc || 8);
    const budWys = parseFloat(budynekConfig.wysokosc || 8);
    const budX = parseFloat(budynekConfig.x || 0);
    const budZ = parseFloat(budynekConfig.z || -10);

    const buildingGeo = new THREE.BoxGeometry(budSzer, budWys, budGleb);
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0x5a5a7a, roughness: 0.6 });
    const building = new THREE.Mesh(buildingGeo, buildingMat);
    building.position.set(budX, budWys / 2, budZ);
    building.castShadow = true;
    building.receiveShadow = true;
    scene.add(building);

    // Panele PV (uproszczone - prostokaty na ziemi)
    const panelMeshes = [];
    const katNachylenia = parseFloat(instalacjaConfig.kat_nachylenia || 30);
    const panelWidth = 1.1; // szerokosc panela [m]
    const panelHeight = 2.1; // wysokosc panela [m]
    const spacing = 0.05;
    const rowSpacing = 3.0;

    // Oblicz pozycje startowa paneli (na poludnie od budynku)
    const panelStartX = budX - ((paneleWRzedzie - 1) * (panelWidth + spacing)) / 2;
    const panelStartZ = budZ + budGleb / 2 + 5; // 5m na poludnie od budynku

    for (let row = 0; row < liczbaRzedow; row++) {
        for (let col = 0; col < paneleWRzedzie; col++) {
            const idx = row * paneleWRzedzie + col;
            if (idx >= liczbaPaneli) break;

            const panelGeo = new THREE.BoxGeometry(panelWidth, 0.04, panelHeight * Math.cos(THREE.MathUtils.degToRad(katNachylenia)));
            const panelMat = new THREE.MeshStandardMaterial({ color: 0x1e3a5f, roughness: 0.3, metalness: 0.5 });
            const panel = new THREE.Mesh(panelGeo, panelMat);

            const px = panelStartX + col * (panelWidth + spacing);
            const pz = panelStartZ + row * rowSpacing;
            const py = 0.5 + (panelHeight * Math.sin(THREE.MathUtils.degToRad(katNachylenia))) / 2;

            panel.position.set(px, py, pz);
            panel.rotation.x = -THREE.MathUtils.degToRad(katNachylenia);
            panel.castShadow = true;
            panel.receiveShadow = true;
            scene.add(panel);
            panelMeshes.push(panel);
        }
    }

    // Siatka pomocnicza
    const gridHelper = new THREE.GridHelper(80, 40, 0x333355, 0x222244);
    gridHelper.position.y = 0.005;
    scene.add(gridHelper);

    // ===== RESIZE =====
    function onResize() {
        const w = canvas.parentElement.clientWidth;
        const h = canvas.parentElement.clientHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', onResize);
    onResize();

    // ===== RENDER LOOP =====
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // ===== POZYCJA SLONCA =====
    function updateSunPosition(azymutDeg, elewacjaDeg) {
        const azRad = THREE.MathUtils.degToRad(azymutDeg);
        const elRad = THREE.MathUtils.degToRad(Math.max(elewacjaDeg, 1));
        const dist = 50;

        // Konwersja azymutu astronomicznego na uklad Three.js
        // Azymut 0=N, 90=E, 180=S, 270=W
        // Three.js: X=E, Z=S (przy azym 180 -> Z dodatnie)
        const x = dist * Math.cos(elRad) * Math.sin(azRad);
        const y = dist * Math.sin(elRad);
        const z = dist * Math.cos(elRad) * Math.cos(azRad);

        // Odwracamy Z bo w Three.js -Z to "przod" (polnoc)
        sunLight.position.set(x, y, -z);
        sunLight.target.position.set(0, 0, 0);

        // Wskaznik slonca
        const indDist = 35;
        sunIndicator.position.set(
            indDist * Math.cos(elRad) * Math.sin(azRad),
            indDist * Math.sin(elRad),
            -indDist * Math.cos(elRad) * Math.cos(azRad)
        );

        // Intensywnosc swiatla zalezna od elewacji
        const intensity = elewacjaDeg > 0 ? Math.min(1.5, elewacjaDeg / 30 * 1.5) : 0.1;
        sunLight.intensity = intensity;
    }

    // ===== DIAGRAM PANELI =====
    function initPanelGrid() {
        const grid = document.getElementById('panel-grid');
        grid.style.gridTemplateColumns = `repeat(${paneleWRzedzie}, 1fr)`;
        grid.innerHTML = '';
        for (let i = 0; i < liczbaPaneli; i++) {
            const cell = document.createElement('div');
            cell.className = 'panel-cell';
            cell.id = `pcell-${i}`;
            cell.innerHTML = `<span class="panel-num">P${i + 1}</span><span class="panel-pct">--%</span>`;
            cell.style.background = '#1e3a5f';
            grid.appendChild(cell);
        }
    }

    function getColorForEfficiency(pct) {
        if (pct >= 100) return '#1e3a5f';
        if (pct >= 80) return '#38bdf8';
        if (pct >= 50) return '#fbbf24';
        if (pct >= 20) return '#f97316';
        return '#ef4444';
    }

    function updatePanelDiagram(paneleData) {
        for (let i = 0; i < liczbaPaneli; i++) {
            const cell = document.getElementById(`pcell-${i}`);
            if (!cell) continue;

            let pct = 0;
            if (paneleData && paneleData[i]) {
                const p = paneleData[i];
                if (p.produkcja_bez_cienia_wh > 0) {
                    pct = Math.round((p.produkcja_wh / p.produkcja_bez_cienia_wh) * 100);
                } else {
                    pct = 0;
                }
            }
            const color = getColorForEfficiency(pct);
            cell.style.background = color;
            cell.querySelector('.panel-pct').textContent = `${pct}%`;
        }
    }

    function updatePowerSummary(podsumowanie) {
        document.getElementById('pwr-current').textContent = `${podsumowanie.produkcja_wh.toFixed(0)} W`;
        document.getElementById('pwr-max').textContent = `${podsumowanie.produkcja_bez_cienia_wh.toFixed(0)} W`;
        document.getElementById('pwr-loss').textContent = `${podsumowanie.strata_procent.toFixed(1)}%`;
    }

    // ===== POBIERANIE DANYCH =====
    let consecutiveFetchErrors = 0;
    const MAX_ERRORS_BEFORE_INDICATOR = 2;

    function showErrorIndicator(msg) {
        let el = document.getElementById('fetch-error-indicator');
        if (!el) {
            el = document.createElement('div');
            el.id = 'fetch-error-indicator';
            el.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:rgba(239,68,68,0.9);color:#fff;padding:8px 18px;border-radius:8px;font-size:0.82rem;z-index:9999;pointer-events:none;transition:opacity 0.3s;';
            document.body.appendChild(el);
        }
        el.textContent = msg;
        el.style.opacity = '1';
    }

    function hideErrorIndicator() {
        const el = document.getElementById('fetch-error-indicator');
        if (el) el.style.opacity = '0';
    }

    async function fetchSolarPosition(dateStr, godzina, minuta) {
        const [rok, miesiac, dzien] = dateStr.split('-').map(Number);
        const params = new URLSearchParams({
            lat: lokalizacja.szerokosc_geo,
            lon: lokalizacja.dlugosc_geo,
            rok, miesiac, dzien, godzina, minuta
        });
        try {
            const resp = await fetch(`/api/solar-position?${params}`);
            if (resp.ok) {
                consecutiveFetchErrors = 0;
                hideErrorIndicator();
                return await resp.json();
            }
            consecutiveFetchErrors++;
            if (consecutiveFetchErrors >= MAX_ERRORS_BEFORE_INDICATOR) {
                showErrorIndicator(`Blad pobierania pozycji slonca (HTTP ${resp.status})`);
            }
        } catch (e) {
            consecutiveFetchErrors++;
            if (consecutiveFetchErrors >= MAX_ERRORS_BEFORE_INDICATOR) {
                showErrorIndicator('Brak polaczenia z serwerem');
            }
        }
        return null;
    }

    // Cache for shading data - keyed by "date|hour"
    let shadingCache = { key: null, data: null };

    async function fetchShadingData(dateStr, godzina) {
        const cacheKey = `${dateStr}|${godzina}`;
        if (shadingCache.key === cacheKey) {
            return shadingCache.data;
        }
        try {
            const payload = {
                data: dateStr,
                godzina: godzina,
                instalacja: {
                    panel_id: instalacjaConfig.panel_id || 'ja_solar_jam72s30_550mr',
                    orientacja: instalacjaConfig.orientacja || 'pion',
                    kat_nachylenia: parseFloat(instalacjaConfig.kat_nachylenia || 30),
                    azymut: parseFloat(instalacjaConfig.azymut || 0),
                    przeswit_nad_gruntem_cm: parseFloat(instalacjaConfig.przeswit_nad_gruntem_cm || 50),
                    odstep_boczny_cm: parseFloat(instalacjaConfig.odstep_boczny_cm || 3),
                    liczba_paneli: liczbaPaneli,
                    liczba_rzedow: liczbaRzedow
                },
                budynek: {
                    x: parseFloat(budynekConfig.x || 0),
                    z: parseFloat(budynekConfig.z || -10),
                    szerokosc: parseFloat(budynekConfig.szerokosc || 10),
                    glebokosc: parseFloat(budynekConfig.glebokosc || 8),
                    wysokosc: parseFloat(budynekConfig.wysokosc || 8)
                },
                lokalizacja: {
                    szerokosc_geo: parseFloat(lokalizacja.szerokosc_geo),
                    dlugosc_geo: parseFloat(lokalizacja.dlugosc_geo)
                }
            };
            const resp = await fetch('/api/shading/single-hour', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (resp.ok) {
                const result = await resp.json();
                shadingCache = { key: cacheKey, data: result };
                consecutiveFetchErrors = 0;
                hideErrorIndicator();
                return result;
            }
            consecutiveFetchErrors++;
            if (consecutiveFetchErrors >= MAX_ERRORS_BEFORE_INDICATOR) {
                showErrorIndicator(`Blad pobierania danych zacienienia (HTTP ${resp.status})`);
            }
        } catch (e) {
            consecutiveFetchErrors++;
            if (consecutiveFetchErrors >= MAX_ERRORS_BEFORE_INDICATOR) {
                showErrorIndicator('Brak polaczenia z serwerem');
            }
        }
        return null;
    }

    // ===== AKTUALIZACJA KROKU ANIMACJI =====
    function stepToTime(step) {
        // Step 0 = 5:00, step 64 = 21:00 (kazdy step = 15 min)
        const totalMinutes = 5 * 60 + step * 15;
        const h = Math.floor(totalMinutes / 60);
        const m = totalMinutes % 60;
        return { godzina: h, minuta: m };
    }

    function formatTime(h, m) {
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    async function updateFrame(step) {
        const { godzina, minuta } = stepToTime(step);
        const dateStr = document.getElementById('anim-date').value;

        // Aktualizuj wyswietlacz czasu
        document.getElementById('time-display').textContent = formatTime(godzina, minuta);

        // Pobierz pozycje slonca
        const sunPos = await fetchSolarPosition(dateStr, godzina, minuta);
        if (sunPos) {
            document.getElementById('sun-display').textContent = `Azymut: ${sunPos.azymut.toFixed(0)}\u00B0, Elewacja: ${sunPos.elewacja.toFixed(0)}\u00B0`;
            updateSunPosition(sunPos.azymut, sunPos.elewacja);
        }

        // Pobierz dane zacienienia (uzywa pelnej godziny, cached per hour)
        const shadingData = await fetchShadingData(dateStr, godzina);
        if (shadingData) {
            updatePanelDiagram(shadingData.panele);
            updatePowerSummary(shadingData.podsumowanie);
        } else {
            // Reset diagrams when no data
            updatePanelDiagram(null);
            document.getElementById('pwr-current').textContent = '--- W';
            document.getElementById('pwr-max').textContent = '--- W';
            document.getElementById('pwr-loss').textContent = '--- %';
        }
    }

    // ===== KONTROLKI =====
    function scheduleNextFrame() {
        if (!isPlaying) return;
        const intervalMs = 1000 / speedMultiplier;
        animInterval = setTimeout(async () => {
            if (!isPlaying) return;
            currentStep++;
            if (currentStep > 64) currentStep = 0;
            document.getElementById('anim-slider').value = currentStep;
            await updateFrame(currentStep);
            scheduleNextFrame();
        }, intervalMs);
    }

    window.togglePlay = function() {
        const btn = document.getElementById('btn-play');
        if (isPlaying) {
            clearTimeout(animInterval);
            animInterval = null;
            isPlaying = false;
            btn.textContent = '\u25B6 Play';
            btn.classList.remove('playing');
        } else {
            isPlaying = true;
            btn.textContent = '\u23F8 Pauza';
            btn.classList.add('playing');
            scheduleNextFrame();
        }
    };

    window.onSliderChange = function(val) {
        currentStep = parseInt(val);
        updateFrame(currentStep);
    };

    window.setSpeed = function(speed, btnEl) {
        speedMultiplier = speed;
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
        // Jesli gramy - restart z nowa predkoscia (setTimeout-chaining
        // automatycznie uzyje nowego speedMultiplier przy kolejnym wywolaniu)
    };

    // ===== INICJALIZACJA =====
    initPanelGrid();

    // Ustaw domyslna date na dzis
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    document.getElementById('anim-date').value = todayStr;

    // Invalidate shading cache when date changes
    document.getElementById('anim-date').addEventListener('change', () => {
        shadingCache = { key: null, data: null };
    });

    // Pierwsze zaladowanie klatki
    updateFrame(currentStep);
    </script>
</body>
</html>
